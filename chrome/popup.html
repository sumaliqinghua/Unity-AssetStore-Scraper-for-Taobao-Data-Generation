<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      padding: 5px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #ff8533;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label>商品标题:</label>
    <input type="text" id="titleContent" placeholder="输入商品标题">
  </div>
  <div class="form-group">
    <label>商品价格:</label>
    <input type="number" id="price" placeholder="输入商品价格" step="0.01">
  </div>
  <div class="form-group">
    <label>详情内容:</label>
    <textarea id="detailContent" rows="4" placeholder="输入商品详情描述"></textarea>
  </div>
  <div class="form-group">
    <label>图片路径:</label>
    <input type="text" id="imagePath" placeholder="输入本地图片完整路径">
  </div>
  <button id="saveConfig">保存配置</button>
  <button id="fillContent">开始填充</button>
  <script src="popup.js"></script>
</body>
</html>
